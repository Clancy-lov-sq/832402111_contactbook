# Reverse proxy in front of the Node.js service.
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/contactbook
#   ln -s /etc/nginx/sites-available/contactbook /etc/nginx/sites-enabled/contactbook
#   nginx -t && systemctl reload nginx
#
# Replace book.example.com with the real domain; certbot can add the TLS block.

server {
    listen 80;
    server_name book.example.com;

    # The import endpoint accepts a workbook of at most 5 MB; the limit leaves a
    # little room for the multipart envelope.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Hashed file names may be cached for a year; index.html stays uncached.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
